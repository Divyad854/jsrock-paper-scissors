<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>✊ Rock Paper Scissors ✋</h1>

        <p>Choose your move:</p>

        <!-- Round Counter -->
        <p id="round">Round 1 of 5</p>

        <div class="choices">

            <button id="rock">✊ Rock</button>

            <button id="paper">📄 Paper</button>

            <button id="scissors">✂️ Scissors</button>

        </div>

        <div class="result">

            <h2 id="message">Make your choice!</h2>

            <p id="playerChoice"><b>You:</b> -</p>

            <p id="computerChoice"><b>Computer:</b> -</p>

        </div>

        <div class="score">

            <p id="playerScore"><b>Your Score:</b> 0</p>

            <p id="computerScore"><b>Computer Score:</b> 0</p>

        </div>

        <button id="reset">Reset Game</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
